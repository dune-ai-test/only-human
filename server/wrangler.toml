# The world server — one Durable-less Worker + D1.
# See ../docs/world-server.md for the full contract.

name = "only-human-worlds"
main = "src/index.ts"
compatibility_date = "2026-04-01"

# The heartbeat: every minute, due jobs run (ticks, replies, asks).
[triggers]
crons = ["* * * * *"]

[vars]
DEFAULT_ENDPOINT = "https://api.kilo.ai/api/gateway"
DEFAULT_MODEL = "poolside/laguna-s-2.1:free"

# Replace database_id with the one `wrangler d1 create only-human-worlds` prints.
[[d1_databases]]
binding = "DB"
database_name = "only-human-worlds"
database_id = "00000000-0000-0000-0000-000000000000"
