name: Nightly Server

# Builds the app exactly as it exists on this branch and publishes it to its
# own rolling release (`nightly-server`), so the world-server work can be
# installed and tested on a phone without touching the `nightly` channel or
# `main` in any way.
#
# GitHub only shows the manual "Run workflow" button for workflows that live
# on the default branch (main), so this branch-only workflow is triggered by
# a marker commit instead:
#
#   git commit --allow-empty -m "[app-build] nightly-server"
#   git push
#
# Pushes without the marker are no-ops (the run appears as skipped).
on:
  push:
    branches: [world-server]
  workflow_dispatch:

concurrency:
  group: nightly-server
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  nightly-server:
    name: Build & publish server APK
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.head_commit.message, '[app-build]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The ubuntu runner image already ships a full Android SDK
      # (platforms, build-tools, cmdline-tools) with licenses accepted.

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew assembleDebug -PversionSuffix=nightly-server.${{ github.run_number }} --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk OnlyHuman-nightly-server.apk

      - name: Publish rolling nightly-server release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly-server
          name: Nightly Server
          prerelease: true
          make_latest: false
          files: OnlyHuman-nightly-server.apk
          body: |
            Manual build from the `world-server` branch — the server-era
            channel, separate from `nightly`.

            - Build: `nightly-server.${{ github.run_number }}` (versionName shows it in the app)
            - Commit: `${{ github.sha }}`
            - Built: ${{ github.event.repository.updated_at }}

            **Install:** download `OnlyHuman-nightly-server.apk` below on your phone and open it.
            (Android will ask once for permission to install apps from this browser.)
